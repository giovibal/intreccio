      <circle cx="14" cy="37" r="2.8"/>
      <circle cx="50" cy="27" r="2.8"/>
      <circle cx="37" cy="50" r="2.8"/>
    </g>
  </g>
  <!-- Wordmark -->
  <text x="88" y="51" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="0.5">
    <tspan fill="#7C5CFF">intre</tspan><tspan fill="#12C2A6">ccio</tspan>
