<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="intreccio logo">
  <title>intreccio</title>
  <!-- Two interlocked loops, woven over/under: interlacing (intreccio) + a graph. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Loop A (violet), drawn under at the top-right crossing -->
    <rect x="14" y="14" width="26" height="26" rx="9" stroke="#7C5CFF" stroke-width="5"/>
    <!-- Loop B (teal), drawn over A -->
    <rect x="24" y="24" width="26" height="26" rx="9" stroke="#12C2A6" stroke-width="5"/>
    <!-- Weave: bring Loop A back over Loop B at the top-right crossing -->
    <path d="M40 20.5 L40 27.5" stroke="#7C5CFF" stroke-width="5"/>
  </g>
  <!-- Graph nodes sitting on the strands -->
  <g fill="#F6A833">
    <circle cx="27" cy="14" r="2.8"/>
    <circle cx="14" cy="37" r="2.8"/>
    <circle cx="50" cy="27" r="2.8"/>
    <circle cx="37" cy="50" r="2.8"/>
  </g>
</svg>
